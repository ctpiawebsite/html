<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CTPIA Email Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
    }

    #mc_embed_signup {
      width: 70%;
      max-width: 600px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="email"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
    }

    .button {
      padding: 12px;
      background-color: #0073aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .asterisk {
      color: red;
    }

    .indicates-required {
      font-size: 0.9em;
      color: #333;
    }

    .response {
      font-size: 0.9em;
      color: red;
    }
  </style>
</head>
<body>
  <div id="mc_embed_signup">
    <form action="https://ctpia.us17.list-manage.com/subscribe/post?u=da65fc341cdd72e353e5436c9&amp;id=86061b6814" method="post" target="_blank" novalidate>
      <div class="indicates-required"><span class="asterisk">*</span> indicates required</div>

      <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
      <input type="email" name="EMAIL" id="mce-EMAIL" required>

      <label for="mce-FNAME">First Name</label>
      <input type="text" name="FNAME" id="mce-FNAME">

      <label for="mce-LNAME">Last Name</label>
      <input type="text" name="LNAME" id="mce-LNAME">

      <label for="mce-ADDRESS">Address</label>
      <input type="text" name="ADDRESS" id="mce-ADDRESS">

      <label for="mce-MMERGE4">Company</label>
      <input type="text" name="MMERGE4" id="mce-MMERGE4">

      <div class="response" id="mce-error-response" style="display:none"></div>
      <div class="response" id="mce-success-response" style="display:none"></div>

      <!-- Hidden anti-bot field -->
      <div style="position: absolute; left: -5000px;" aria-hidden="true">
        <input type="text" name="b_da65fc341cdd72e353e5436c9_86061b6814" tabindex="-1" value="">
      </div>

      <input type="submit" value="Subscribe" name="subscribe" class="button">
    </form>
  </div>

  <script src="//s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script>
  <script>
    (function($) {
      window.fnames = []; window.ftypes = [];
      fnames[0] = 'EMAIL'; ftypes[0] = 'email';
      fnames[1] = 'FNAME'; ftypes[1] = 'text';
      fnames[2] = 'LNAME'; ftypes[2] = 'text';
      fnames[4] = 'MMERGE4'; ftypes[4] = 'text';
    })(jQuery);
    var $mcj = jQuery.noConflict(true);
  </script>
</body>
</html>
